<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Conectar WhatsApp</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f5f7;
        color: #111;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #16181d; color: #f4f5f7; }
        .card { background: #1f2229 !important; box-shadow: none !important; }
        .log { background: #14161a !important; }
      }
      .card {
        width: min(420px, 92vw);
        background: #fff;
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        text-align: center;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p.sub { margin: 0 0 24px; opacity: 0.7; font-size: 14px; }
      button {
        appearance: none;
        border: none;
        border-radius: 10px;
        background: #25d366;
        color: #062e16;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 20px;
        cursor: pointer;
        width: 100%;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .log {
        margin-top: 20px;
        text-align: left;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        background: #f0f1f3;
        border-radius: 10px;
        padding: 12px;
        max-height: 180px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .log:empty { display: none; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Conectar seu WhatsApp Business</h1>
      <p class="sub">Você será redirecionado para autorizar o acesso.</p>
      <button id="signup" disabled>Carregando…</button>
      <div class="log" id="log" aria-live="polite"></div>
    </main>

    <script>
      const logEl = document.getElementById("log");
      const btn = document.getElementById("signup");
      const log = (msg) => {
        logEl.textContent += msg + "\n";
        logEl.scrollTop = logEl.scrollHeight;
      };

      // Session info (waba_id, phone_number_id) arrives via postMessage from the
      // Embedded Signup popup. We hold it here and combine with the OAuth code.
      let sessionInfo = null;

      window.addEventListener("message", (event) => {
        if (
          event.origin !== "https://www.facebook.com" &&
          event.origin !== "https://web.facebook.com"
        ) {
          return;
        }
        let data;
        try {
          data = JSON.parse(event.data);
        } catch {
          return;
        }
        if (data.type !== "WA_EMBEDDED_SIGNUP") return;
        if (data.event === "FINISH" || data.event === "FINISH_ONLY_WABA") {
          sessionInfo = data.data;
          log("Conta selecionada: WABA " + data.data.waba_id);
        } else if (data.event === "CANCEL") {
          log("Fluxo cancelado na etapa: " + (data.data && data.data.current_step));
        }
      });

      async function completeOnboarding(code) {
        if (!sessionInfo) {
          log("Erro: não recebemos os dados da conta (waba_id/phone_number_id).");
          return;
        }
        log("Finalizando onboarding no servidor…");
        const res = await fetch("/onboarding/complete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            code,
            wabaId: sessionInfo.waba_id,
            phoneNumberId: sessionInfo.phone_number_id,
          }),
        });
        const out = await res.json().catch(() => ({}));
        if (res.ok) {
          log("✅ Conectado com sucesso! WABA " + out.wabaId);
        } else {
          log("❌ Falha: " + (out.message || res.status));
        }
      }

      // --- Facebook JS SDK bootstrap ---
      async function init() {
        const cfg = await fetch("/config.json").then((r) => r.json());

        window.fbAsyncInit = function () {
          FB.init({
            appId: cfg.appId,
            autoLogAppEvents: true,
            xfbml: true,
            version: cfg.graphVersion,
          });
          btn.disabled = false;
          btn.textContent = "Conectar WhatsApp";
        };

        btn.addEventListener("click", () => {
          sessionInfo = null;
          logEl.textContent = "";
          FB.login(
            (response) => {
              if (response.authResponse && response.authResponse.code) {
                completeOnboarding(response.authResponse.code);
              } else {
                log("Login não concluído.");
              }
            },
            {
              config_id: cfg.configId,
              response_type: "code",
              override_default_response_type: true,
              extras: { setup: {}, featureType: "", sessionInfoVersion: "3" },
            },
          );
        });

        // Load the SDK.
        const s = document.createElement("script");
        s.async = true;
        s.defer = true;
        s.crossOrigin = "anonymous";
        s.src = "https://connect.facebook.net/en_US/sdk.js";
        document.body.appendChild(s);
      }

      init().catch((e) => log("Erro ao inicializar: " + e.message));
    </script>
  </body>
</html>
